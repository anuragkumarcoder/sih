server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ner-smart-logistics-backend

  # Relational Database Configuration (MySQL / H2 fallback for testing)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ner_logistics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # NoSQL Database Configuration (MongoDB - Geospatial 2dsphere & Time-Series)
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ner_telemetry_db}
      auto-index-creation: true

# AI Microservice Client Configuration
ner:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 86400000 # 24 Hours

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.sih.nerlogistics: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.data.jpa: INFO
