version: '3.8'

services:
  # 1. Relational Database: MySQL 8 (ACID Compliance for Master Data)
  mysql-db:
    image: mysql:8.0
    container_name: ner-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ner_logistics_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts/01-init-mysql.sql:/docker-entrypoint-initdb.d/01-init-mysql.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ner-network

  # 2. NoSQL Database: MongoDB 7 (High-Velocity Geospatial 2dsphere & Time-Series)
  mongo-db:
    image: mongo:7.0
    container_name: ner-mongo-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./init-scripts/02-init-mongo.js:/docker-entrypoint-initdb.d/02-init-mongo.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ner-network

  # 3. AI/ML Microservice: FastAPI (Python Predictive Routing & Landslide Engine)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ner-ai-microservice
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ner-network

  # 4. Enterprise Backend: Spring Boot 3 (Java Multi-DB Transaction & Gateway)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ner-backend-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ner_logistics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_DATA_MONGODB_URI=mongodb://mongo-db:27017/ner_telemetry_db
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      mysql-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - ner-network

  # 5. Interactive GIS Dashboard: React + Vite + Leaflet
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ner-frontend-dashboard
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ai-service
    networks:
      - ner-network

networks:
  ner-network:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
